name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version manually (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        $inputVersion = '${{ github.event.inputs.version }}'
        if ($inputVersion -and $inputVersion -ne '') {
            $ver = $inputVersion
        } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
            $ver = '0.0.0-test'
        }
        echo "version=$ver" >> $env:GITHUB_OUTPUT
        Write-Host "Building version $ver"

    - name: Publish
      shell: pwsh
      run: |
        $publishDir = "publish/${{ matrix.rid }}"
        if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
        dotnet publish StarfieldWeaponIconFileBuilder/StarfieldWeaponIconFileBuilder.csproj `
          -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o $publishDir

    - name: Package Release
      shell: pwsh
      run: |
        $packageDir = "publish/${{ matrix.rid }}/package"
        if (Test-Path $packageDir) { Remove-Item $packageDir -Recurse -Force }
        mkdir $packageDir
        cp -r publish/${{ matrix.rid }}/* $packageDir/
        cp -r StarfieldWeaponIconFileBuilder/FFDec $packageDir/FFDec
        mkdir $packageDir/Assets
        cp StarfieldWeaponIconFileBuilder/Assets/CCSUP_CustomWeaponTemplate.swf $packageDir/Assets/
        cp README.md $packageDir/
        cp ThirdPartyNotices.txt $packageDir/
        cp LICENSE $packageDir/
        $zipPath = "publish/StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath }
        Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.rid }}
        path: publish/StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip

  release:
    needs: build-and-release
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if (${{ github.event.inputs.version }}) {
            $ver = "${{ github.event.inputs.version }}"
        } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
            $ver = '0.0.0-test'
        }
        echo "version=$ver" >> $env:GITHUB_OUTPUT
        Write-Host "Using version $ver"

    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create GitHub Release with Direct Download URLs
      if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Starfield Weapon Icon File Builder v${{ steps.version.outputs.version }}
        body: |
          Starfield Weapon Icon File Builder v${{ steps.version.outputs.version }}

          Requirements:
          - Java 8 or newer

          Downloads:
          - [Windows x64](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/StarfieldWeaponIconFileBuilder-win-x64-v${{ steps.version.outputs.version }}.zip)
          - [Linux x64](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/StarfieldWeaponIconFileBuilder-linux-x64-v${{ steps.version.outputs.version }}.zip)
          - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/StarfieldWeaponIconFileBuilder-osx-x64-v${{ steps.version.outputs.version }}.zip)
          - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/StarfieldWeaponIconFileBuilder-osx-arm64-v${{ steps.version.outputs.version }}.zip)
        files: |
          artifacts/StarfieldWeaponIconFileBuilder-win-x64-v${{ steps.version.outputs.version }}.zip
          artifacts/StarfieldWeaponIconFileBuilder-linux-x64-v${{ steps.version.outputs.version }}.zip
          artifacts/StarfieldWeaponIconFileBuilder-osx-x64-v${{ steps.version.outputs.version }}.zip
          artifacts/StarfieldWeaponIconFileBuilder-osx-arm64-v${{ steps.version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version manually (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.determine-version.outputs.version }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Determine version
      id: determine-version
      shell: pwsh
      run: |
        $inputVersion = '${{ github.event.inputs.version }}'
        if ($inputVersion -and $inputVersion -ne '') {
            $ver = $inputVersion
        } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
            $ver = '0.0.0-test'
        }
        echo "version=$ver" >> $env:GITHUB_OUTPUT
        Write-Host "Building version $ver"

    - name: Publish
      shell: pwsh
      run: |
        $publishDir = "publish/${{ matrix.rid }}"
        if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }

        dotnet publish StarfieldWeaponIconFileBuilder/StarfieldWeaponIconFileBuilder.csproj `
          -c Release -r ${{ matrix.rid }} --self-contained true `
          -p:PublishSingleFile=true -o $publishDir

    - name: Package Release
      shell: pwsh
      run: |
        $publishDir = "publish/${{ matrix.rid }}"
        $packageDir = "$publishDir/package"

        if (Test-Path $packageDir) { Remove-Item $packageDir -Recurse -Force }
        mkdir $packageDir

        Get-ChildItem $publishDir -Directory | Where-Object { $_.Name -ne 'package' } | ForEach-Object {
            Copy-Item $_.FullName -Recurse -Destination $packageDir
        }

        Get-ChildItem $publishDir -File | ForEach-Object {
            Copy-Item $_.FullName -Destination $packageDir
        }

        Copy-Item "StarfieldWeaponIconFileBuilder/FFDec" -Recurse -Destination "$packageDir/FFDec"
        mkdir "$packageDir/Assets"
        Copy-Item "StarfieldWeaponIconFileBuilder/Assets/CCSUP_CustomWeaponTemplate.swf" "$packageDir/Assets/"
        Copy-Item "README.md" $packageDir/
        Copy-Item "ThirdPartyNotices.txt" $packageDir/
        Copy-Item "LICENSE" $packageDir/

        $zipPath = "publish/StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-${{ steps.determine-version.outputs.version }}.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath }

        Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.rid }}
        path: publish/StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-${{ steps.determine-version.outputs.version }}.zip

  release:
    needs: build-and-release
    runs-on: windows-latest

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.6.1
      with:
        name: ${{ needs.build-and-release.outputs.version }}
        tag_name: ${{ needs.build-and-release.outputs.version }}
        generate_release_notes: true
        body: |
          ## Starfield Weapon Icon File Builder ${{ needs.build-and-release.outputs.version }}

          **Requirements**:
          - Java 8 or newer
          - FFDec v25.1.3 nightly build 3471 or newer _(this is included in the download)_
          - .NET 9.0 _(this is embedded with the application)_

          **Downloads**:
          - [Windows x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.version }}/StarfieldWeaponIconFileBuilder-win-x64-${{ needs.build-and-release.outputs.version }}.zip)
          - [Linux x64](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.version }}/StarfieldWeaponIconFileBuilder-linux-x64-${{ needs.build-and-release.outputs.version }}.zip)
          - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.version }}/StarfieldWeaponIconFileBuilder-osx-x64-${{ needs.build-and-release.outputs.version }}.zip)
          - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.version }}/StarfieldWeaponIconFileBuilder-osx-arm64-${{ needs.build-and-release.outputs.version }}.zip)

        files: |
          artifacts/release-win-x64/*.zip
          artifacts/release-linux-x64/*.zip
          artifacts/release-osx-x64/*.zip
          artifacts/release-osx-arm64/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
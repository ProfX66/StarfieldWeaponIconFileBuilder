name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    - name: Get Version
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
            $ver = '0.0.0-test'
        }
        echo "version=$ver" >> $env:GITHUB_OUTPUT

    - name: Publish
      shell: pwsh
      run: |
        dotnet publish StarfieldWeaponIconFileBuilder/StarfieldWeaponIconFileBuilder.csproj `
          -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish

    - name: Create Package
      shell: pwsh
      run: |
        mkdir package
        cp -r publish/* package/
        cp -r StarfieldWeaponIconFileBuilder/FFDec package/FFDec
        mkdir package/Assets
        cp StarfieldWeaponIconFileBuilder/Assets/CCSUP_CustomWeaponTemplate.swf package/Assets/
        cp README.md package/
        cp ThirdPartyNotices.txt package/
        cp LICENSE package/

    - name: Zip Package
      shell: pwsh
      run: |
        $zipPath = "../StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-${{ steps.version.outputs.version }}.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath }
        Compress-Archive -Path package/* -DestinationPath $zipPath

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: release-${{ matrix.rid }}
        path: StarfieldWeaponIconFileBuilder-${{ matrix.rid }}-${{ steps.version.outputs.version }}.zip

  release:
    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Get Version
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
            $ver = '0.0.0-test'
        }
        echo "version=$ver" >> $env:GITHUB_OUTPUT

    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Starfield Weapon Icon File Builder ${{ steps.version.outputs.version }}
        body: |
          Starfield Weapon Icon File Builder ${{ steps.version.outputs.version }}

          Requirements:
          - Java 8 or newer

          Downloads:
          - Windows: win-x64
          - Linux: linux-x64
          - macOS Intel: osx-x64
          - macOS Apple Silicon: osx-arm64
        files: artifacts/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}